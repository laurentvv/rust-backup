[workspace]
resolver = "3"
members = ["crates/rb-core", "crates/rb-cli"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
duckdb = { version = "1.20000.1", features = ["bundled"] }
fastcdc = "5"
blake3 = "1"
zstd = "0.13"
aes-gcm = "0.10"
argon2 = "0.6"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
walkdir = "2"

[package]
name = "rust-backup"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "=0.9.0"
