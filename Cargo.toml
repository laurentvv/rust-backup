[workspace]
resolver = "3"
members = ["crates/rb-core", "crates/rb-cli"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
duckdb = { version = "1.20000.1", features = ["bundled"] }
fastcdc = "5"
blake3 = "1"
zstd = "0.13"
aes-gcm = "0.10"
argon2 = "0.6"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
walkdir = "2"
filetime = "0.2"
flume = "0.12"
russh = "0.65"
russh-sftp = "3.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }

[package]
name = "rust-backup"
version = "0.2.1"
edition = "2024"
build = "build.rs"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "rust-backup"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.0"
rb-core = { path = "crates/rb-core" }
flume = "0.12"
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
